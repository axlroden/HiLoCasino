name: Release

# Push a version tag (e.g. v2.2.0) to build the addon zip, publish a GitHub
# release and upload it to CurseForge.
#
# One-time setup (repository settings > Secrets and variables > Actions):
#   secret   CF_API_KEY     - CurseForge API token
#   variable CF_PROJECT_ID  - the CurseForge project ID
# Without them the CurseForge upload is skipped; the GitHub release still runs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ vars.CF_PROJECT_ID && format('-p {0}', vars.CF_PROJECT_ID) || '' }}
