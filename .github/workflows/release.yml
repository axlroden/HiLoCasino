name: Release

# Push a version tag (e.g. v2.2.0) to build the addon zip, publish a GitHub
# release and upload it to CurseForge (same setup as axlroden/SpellReplay).
#
# One-time setup:
#   - "## X-Curse-Project-ID: <id>" in RollCasino.toc
#   - repository secret CF_API_KEY = CurseForge API token
# Without them the CurseForge upload is skipped; the GitHub release still runs.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the packager

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
